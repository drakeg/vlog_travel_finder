services:
  app:
    build:
      context: .
    environment:
      SECRET_KEY: ${SECRET_KEY:-docker-compose-dev-secret}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/instance/vlog_site.sqlite}
      CSRF_ENABLED: ${CSRF_ENABLED:-true}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      FLASK_DEBUG: ${FLASK_DEBUG:-1}
    command:
      - python
      - -m
      - flask
      - --app
      - vlog_site:create_app
      - run
      - --host=0.0.0.0
      - --port=5000
    ports:
      - "${APP_PORT:-5000}:5000"
    volumes:
      - .:/app
      - vlog_instance:/app/instance

  test:
    build:
      context: .
    profiles:
      - test
    environment:
      SECRET_KEY: test
    command:
      - python
      - -m
      - pytest
      - -q
    volumes:
      - .:/app

volumes:
  vlog_instance:
